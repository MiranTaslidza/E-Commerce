{% extends 'base.html' %} <!-- uvoizim sadržaj base.html -->

{% block title %}Home{% endblock title %} <!-- ovdje se menja title -->

{% load static %} <!-- uvoizim static fajle -->

<!-- blok za JS static fajlova -->
{% block scripts %}
{% endblock scripts %}

<!-- blok za sadržaj -->
{% block content %}

<div>
    <h1>Today's deals</h1>
    <div>
        <hr class="border border-3">
    </div>
    <div class="row row-cols-1 row-cols-md-5 g-4">
        {% for products in product %}
        <a href="{% url 'detail' products.slug %}">
            <div class="col">
                <div class="card h-100">
                    <img src="{{products.image.url}}" class="card-img-top" alt="{{products.name}}">
                    <div class="card-body">
                        <h5 class="card-title">{{products.name}}</h5>
                        <p class="card-text">{{products.description}}</p>
                    </div>
                    <div class="card-footer">
                        <small class="text-muted">${{products.price}}</small>
                    </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>


{% endblock content %}
